<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PKA Companion</title>
<meta name="description" content="Protótipo navegável do PKA Companion: wiki e companion do PokeAlliance.">
<meta name="theme-color" content="#17131c">
<script>
  (function () {
    let salvo = new URLSearchParams(location.search).get('tema'); if (!salvo) { try { salvo = localStorage.getItem('pka-tema'); } catch (e) {} }
    const mq = matchMedia('(prefers-color-scheme: light)');
    const aplica = () => { document.documentElement.dataset.tema = salvo || (mq.matches ? 'claro' : 'escuro'); };
    aplica(); mq.addEventListener('change', aplica);
    window.__temaSalvo = () => salvo; window.__setTema = v => { salvo = v; aplica(); };
  })();
</script>
<link rel="stylesheet" href="estilo.css">
<style>
  /* ---------- casca do app ---------- */
  .app { min-height: 100dvh; }
  .tela { padding-bottom: calc(var(--dock-h) + 28px + env(safe-area-inset-bottom)); }
  .conteudo { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* dock: 5 portas */
  .dock {
    position: fixed; z-index: 30; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
    height: var(--dock-h); border-radius: 26px;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    background: var(--glass); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
    box-shadow: var(--shadow-3), inset 0 0 0 1px var(--glass-edge);
  }
  .porta {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 11px; font-weight: 600; color: var(--text-3); position: relative; border-radius: 20px;
    transition: color .25s;
  }
  .porta .icone { transition: transform .4s var(--ease); }
  .porta[aria-current="page"] { color: var(--text); }
  .porta[aria-current="page"] .icone { color: var(--accent); transform: translateY(-1px) scale(1.08); }
  .porta[aria-current="page"]::after {
    content: ""; position: absolute; bottom: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }

  @media (min-width: 900px) {
    .dock {
      left: 18px; top: 18px; bottom: 18px; right: auto; width: 88px; height: auto;
      grid-template-columns: 1fr; grid-template-rows: repeat(5, 76px); align-content: center; border-radius: 30px;
    }
    .porta[aria-current="page"]::after { bottom: auto; left: 6px; top: 50%; transform: translateY(-50%); width: 4px; height: 18px; border-radius: 4px; }
    .tela { padding-left: 124px; padding-bottom: 40px; }
  }

  /* cabeçalho de tela */
  .topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 28px 0 18px; }
  .topo h1 { font-size: clamp(30px, 7vw, 44px); margin: 0; }
  .pilula-char {
    display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px;
    background: var(--surface); box-shadow: var(--shadow-1); font-size: 13.5px; font-weight: 600; white-space: nowrap;
  }
  .pilula-char .av { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); overflow: hidden; }
  .pilula-char .av img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.3); }
  .pilula-char span { color: var(--text-3); font-weight: 520; }

  /* ---------- Início: palco com a arte ---------- */
  .palco { position: relative; overflow: hidden; isolation: isolate; min-height: min(66vh, 580px); display: flex; align-items: flex-end; border-radius: 0 0 34px 34px; box-shadow: var(--shadow-3); }
  .palco .fundo { position: absolute; inset: -12%; z-index: -2; background-size: cover; background-position: center; filter: blur(60px) saturate(1.5); opacity: .9; transform: scale(1.1); }
  .palco::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--palco-cor, #3a3a8a); }
  .palco::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(24,14,34,.2) 0%, rgba(24,14,34,0) 30%, rgba(24,14,34,.55) 68%, rgba(24,14,34,.82) 100%); }
  .palco .arte { position: absolute; right: -8%; top: 11%; width: min(70vw, 440px); aspect-ratio: 1; z-index: -1; }
  .palco .arte img { animation: flutua 9s var(--ease) infinite alternate; }
  @keyframes flutua { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  .palco .texto { padding: 0 0 26px; max-width: 520px; color: #fff; }
  .palco .texto .rotulo { color: rgba(255,255,255,.78); }
  .palco h2 { font-size: clamp(34px, 9vw, 60px); margin: 8px 0 12px; }
  .palco p { margin: 0 0 20px; color: rgba(255,255,255,.86); font-size: 16.5px; max-width: 34ch; }
  .palco .acoes { display: flex; gap: 10px; flex-wrap: wrap; }
  .palco .topo-palco { position: absolute; top: 0; left: 0; right: 0; }
  .palco .topo-palco .conteudo { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; }
  .marca { font-stretch: 112%; font-weight: 720; letter-spacing: -0.01em; font-size: 17px; color: #fff; }
  .marca b { color: var(--v-300); font-weight: 720; }

  /* ---------- fileiras de cartões (console) ---------- */
  .fileira { margin-top: 26px; }
  .palco + .conteudo .fileira:first-child { margin-top: 30px; }
  .fileira-cab { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .fileira-cab h3 { margin: 0; font-size: 20px; }
  .fileira-cab a { font-size: 14px; color: var(--text-2); font-weight: 600; }
  .trilho {
    display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 20px 30px; margin: 0 -20px;
    scrollbar-width: none;
  }
  .trilho::-webkit-scrollbar { display: none; }
  .cartao {
    flex: none; scroll-snap-align: start; position: relative; overflow: hidden; isolation: isolate;
    width: 232px; height: 176px; border-radius: var(--r-lg); padding: 16px;
    background: var(--surface); box-shadow: var(--shadow-2);
    display: flex; flex-direction: column; justify-content: flex-end; text-align: left;
    transition: transform .45s var(--ease), box-shadow .45s var(--ease);
  }
  .cartao:hover, .cartao:focus-visible { transform: translateY(-4px) scale(1.035); box-shadow: var(--shadow-3), var(--focus-glow); border-radius: var(--r-lg); }
  .cartao .c-titulo { font-weight: 650; font-size: 16px; line-height: 1.2; }
  .cartao .c-sub { font-size: 13.5px; color: var(--text-2); margin-top: 3px; }
  .cartao .c-arte { position: absolute; right: 8px; top: 8px; width: 92px; height: 92px; z-index: -1; }
  .cartao .c-arte img { width: 100%; height: 100%; object-fit: contain; }
  .cartao.tinto { background: linear-gradient(160deg, color-mix(in oklab, var(--c) 34%, var(--surface)) 0%, var(--surface) 70%); }
  /* cartão saltado: o fundo começa mais abaixo e o Pokémon sai por cima da borda */
  .trilho:has(.saltado) { padding-top: 12px; }
  .cartao.saltado { overflow: visible; background: none; box-shadow: none; height: 194px; }
  .cartao.saltado::before {
    content: ""; position: absolute; inset: 18px 0 0 0; z-index: -2; border-radius: var(--r-lg);
    background: linear-gradient(160deg, color-mix(in oklab, var(--c) 34%, var(--surface)) 0%, var(--surface) 70%);
    box-shadow: var(--shadow-2); transition: box-shadow .45s var(--ease);
  }
  .cartao.saltado:hover, .cartao.saltado:focus-visible { box-shadow: none; }
  .cartao.saltado:hover::before, .cartao.saltado:focus-visible::before { box-shadow: var(--shadow-3), var(--focus-glow); }
  .cartao.saltado .c-arte { right: 2px; top: 0; width: 116px; height: 116px; }
  .cartao.saltado .c-arte img { filter: drop-shadow(0 14px 18px rgba(0,0,0,.45)); }
  .barra { height: 6px; border-radius: 6px; background: var(--surface-3); margin-top: 12px; overflow: hidden; }
  .barra > i { display: block; height: 100%; width: var(--v); border-radius: 6px; background: var(--accent); }
  .cartao.largo { width: 290px; height: auto; justify-content: flex-start; gap: 4px; }
  .cartao .data { font-size: 12.5px; font-weight: 600; color: var(--text-3); }

  /* ---------- Wiki ---------- */
  .campo-busca {
    display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px; border-radius: 18px;
    background: var(--surface); box-shadow: var(--shadow-1); color: var(--text-3); font-size: 16px; width: 100%;
  }
  .campo-busca input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; color: var(--text); font-size: 16px; }
  .campo-busca input:focus-visible { box-shadow: none; }
  .campo-busca input::placeholder { color: var(--text-3); }
  .campo-busca:focus-within { box-shadow: var(--shadow-2), var(--focus-glow); }
  .poke-tile {
    flex: none; width: 150px; scroll-snap-align: start; text-align: left; border-radius: var(--r-lg);
    transition: transform .45s var(--ease);
  }
  .poke-tile .quadro {
    height: 150px; border-radius: var(--r-lg); position: relative; overflow: hidden; isolation: isolate;
    background: radial-gradient(120% 90% at 50% 90%, color-mix(in oklab, var(--c) 42%, var(--surface)) 0%, var(--surface) 70%);
    box-shadow: var(--shadow-2); transition: box-shadow .45s var(--ease);
  }
  .poke-tile .quadro .arte { position: absolute; inset: 10px; }
  .poke-tile .nome { margin-top: 10px; font-weight: 640; font-size: 15px; }
  .poke-tile .meta { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
  .poke-tile:hover, .poke-tile:focus-visible { transform: translateY(-3px); box-shadow: none; }
  .poke-tile:hover .quadro, .poke-tile:focus-visible .quadro { box-shadow: var(--shadow-3), var(--focus-glow); }
  .secao-tile {
    flex: none; width: 190px; height: 118px; scroll-snap-align: start; border-radius: var(--r-lg); padding: 16px;
    display: flex; flex-direction: column; justify-content: space-between; text-align: left;
    background: var(--surface); box-shadow: var(--shadow-2); transition: transform .45s var(--ease), box-shadow .45s var(--ease);
  }
  .secao-tile:hover, .secao-tile:focus-visible { transform: translateY(-3px) scale(1.03); box-shadow: var(--shadow-3), var(--focus-glow); }
  .secao-tile .t { font-weight: 650; font-size: 16px; }
  .secao-tile .d { font-size: 13px; color: var(--text-3); line-height: 1.35; }

  /* ---------- Buscar ---------- */
  .grupo-res { margin-top: 26px; }
  .grupo-res h3 { font-size: 13px; color: var(--text-3); font-weight: 600; margin: 0 0 8px 4px; letter-spacing: .02em; }
  .lista { border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1); overflow: hidden; }
  .linha {
    display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 64px; width: 100%; text-align: left;
    transition: background .2s;
  }
  .linha + .linha { box-shadow: inset 0 1px 0 var(--surface-2); }
  .linha:hover { background: var(--surface-2); }
  .linha .mini { width: 44px; height: 44px; border-radius: 12px; flex: none; position: relative;
    background: radial-gradient(100% 100% at 50% 90%, color-mix(in oklab, var(--c, var(--m-500)) 38%, var(--surface-2)) 0%, var(--surface-2) 80%); }
  .linha .mini img { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); object-fit: contain; }
  .linha .l-t { font-weight: 620; }
  .linha .l-s { font-size: 13px; color: var(--text-3); }
  .linha .dir { white-space: nowrap; margin-left: auto; color: var(--text-3); display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .recentes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .recentes .chip { height: 34px; padding: 0 14px; font-size: 14px; background: var(--surface); box-shadow: var(--shadow-1); color: var(--text); }
  .vazio { padding: 40px 16px; text-align: center; color: var(--text-3); }

  /* ---------- Meus Pokémon ---------- */
  .segmento { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1); }
  .segmento button { height: 40px; padding: 0 18px; border-radius: 999px; font-weight: 620; font-size: 14.5px; color: var(--text-2); transition: background .3s var(--ease), color .2s; }
  .segmento button[aria-selected="true"] { background: var(--accent-strong); color: #fff; box-shadow: 0 2px 6px rgba(10,10,30,.2), 0 6px 16px rgba(10,10,30,.2); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; margin-top: 22px; }
  .grade .poke-tile { width: auto; }
  .grade .poke-tile .quadro { height: auto; aspect-ratio: 1; }
  .invest { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .invest .chip { height: 22px; font-size: 11.5px; padding: 0 8px; }
  .resumo-col { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; color: var(--text-2); font-size: 14px; }
  .resumo-col b { color: var(--text); }

  .time { margin-top: 22px; border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--shadow-2); padding: 20px; }
  .time-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .time-cab h3 { margin: 0; font-size: 22px; }
  .time-cab p { margin: 4px 0 0; color: var(--text-3); font-size: 14px; }
  .slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 18px; }
  @media (max-width: 560px) { .slots { grid-template-columns: repeat(3, 1fr); } }
  .slot { aspect-ratio: 1; border-radius: 18px; position: relative;
    background: radial-gradient(110% 90% at 50% 95%, color-mix(in oklab, var(--c, var(--n-500)) 40%, var(--surface-2)) 0%, var(--surface-2) 75%); }
  .slot .arte { position: absolute; inset: 8%; }
  .slot.falta { background: var(--bg-2); box-shadow: inset 0 2px 8px rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-3); font-size: 12px; font-weight: 600; text-align: center; padding: 6px; }
  .analise { margin-top: 18px; display: grid; gap: 10px; }
  .analise .a { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
  .analise .a .icone { color: var(--data); margin-top: 1px; }
  .analise .a.alerta .icone { color: var(--warn); }
  .analise .a b { font-weight: 640; }

  .acao { display: flex; gap: 14px; align-items: center; padding: 14px 16px; min-height: 72px; }
  .acao + .acao { box-shadow: inset 0 1px 0 var(--surface-2); }
  .estado { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text-3); }
  .estado.feito { background: color-mix(in oklab, var(--ok) 22%, var(--surface)); color: var(--ok); }
  .estado.andando { background: color-mix(in oklab, var(--accent) 22%, var(--surface)); color: var(--accent); }
  .acao .l-s { font-size: 13px; color: var(--text-3); }
  .acao .dir { margin-left: auto; text-align: right; font-size: 13px; color: var(--text-2); white-space: nowrap; }

  /* ---------- Eu ---------- */
  .cartao-eu { border-radius: var(--r-xl); padding: 22px; background: var(--surface); box-shadow: var(--shadow-2); display: flex; gap: 18px; align-items: center; }
  .cartao-eu .av { width: 76px; height: 76px; border-radius: 24px; flex: none; background: radial-gradient(100% 100% at 50% 90%, color-mix(in oklab, var(--el-electric) 45%, var(--surface-2)), var(--surface-2) 75%); position: relative; }
  .cartao-eu .av .arte { position: absolute; inset: 6px; }
  .cartao-eu h2 { margin: 0; font-size: 26px; }
  .cartao-eu p { margin: 4px 0 0; color: var(--text-3); }
  .bloco { margin-top: 22px; }
  .bloco h3 { font-size: 13px; color: var(--text-3); font-weight: 600; margin: 0 0 8px 4px; letter-spacing: .02em; }
  .aviso { font-size: 13px; color: var(--text-3); margin: 10px 4px 0; line-height: 1.45; }

  /* ---------- Ficha: camada sobreposta ---------- */
  .camada {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(14, 8, 20, .38); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
    opacity: 0; transition: opacity .45s var(--ease);
  }
  [data-tema="claro"] .camada { background: rgba(36, 30, 41, .22); }
  .camada.aberta { opacity: 1; }
  .folha {
    width: 100%; max-width: 620px; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain;
    border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--bg); box-shadow: var(--shadow-3);
    transform: translateY(100%); transition: transform .6s var(--ease);
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  .camada.aberta .folha { transform: none; }
  @media (min-width: 900px) {
    .camada { align-items: stretch; justify-content: flex-end; padding: 18px; }
    .folha { max-height: none; height: 100%; border-radius: var(--r-xl); transform: translateX(110%); max-width: 560px; }
  }
  .folha-palco { position: relative; overflow: hidden; isolation: isolate; height: 340px; }
  .folha-palco .fundo { position: absolute; inset: -20%; z-index: -2; background-size: 70%; background-repeat: no-repeat; background-position: center 60%; filter: blur(50px) saturate(1.7); opacity: .95; }
  .folha-palco::before { content: ""; position: absolute; inset: 0; z-index: -3; background: color-mix(in oklab, var(--c) 38%, #2a1b3d); }
  [data-tema="claro"] .folha-palco::before { background: color-mix(in oklab, var(--c) 30%, #ede7f3); }
  .folha-palco::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 55%, var(--bg)); }
  .folha-palco .arte { position: absolute; left: 50%; top: 34px; width: 280px; height: 280px; transform: translateX(-50%); }
  .puxador { position: absolute; top: 8px; left: 50%; width: 42px; height: 5px; border-radius: 5px; transform: translateX(-50%); background: rgba(255,255,255,.55); }
  .folha-topo { position: absolute; top: 18px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 2; }
  .redondo { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(24,18,31,.35); color: #fff; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .redondo:hover { background: rgba(24,18,31,.55); }
  .etiqueta { padding: 0 22px; margin-top: -6px; }
  .etiqueta .num { font-size: 14px; color: var(--text-3); font-weight: 600; }
  .etiqueta h2 { font-size: clamp(36px, 9vw, 48px); margin: 2px 0 12px; }
  .etiqueta .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .alterna { display: inline-grid; grid-auto-flow: column; padding: 3px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1); margin-top: 16px; }
  .alterna button { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 620; color: var(--text-2); }
  .alterna button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
  .leitura-l .icone { color: var(--data); }
  .leituras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 22px; margin-top: 20px; }
  .leitura { border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-1); padding: 14px 12px; min-height: 112px; display: flex; flex-direction: column; gap: 6px; }
  .leitura .icone { color: var(--data); }
  .leitura .v { font-weight: 660; font-size: 15px; line-height: 1.25; }
  .leitura .k { font-size: 12px; color: var(--text-3); line-height: 1.3; }
  .sec { padding: 0 22px; margin-top: 26px; }
  .sec h3 { font-size: 18px; margin: 0 0 10px; }
  .fato { border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-1); padding: 14px 16px; }
  .fato + .fato { margin-top: 10px; }
  .fato p { margin: 0; }
  .fato .pe { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 10px; }
  .reportar { font-size: 12.5px; color: var(--text-3); display: inline-flex; gap: 5px; align-items: center; min-height: 32px; }
  .reportar:hover { color: var(--text); }
  .drops { display: flex; gap: 8px; flex-wrap: wrap; }
  .drops .chip { height: 34px; padding: 0 14px; font-size: 14px; background: var(--surface); box-shadow: var(--shadow-1); color: var(--text); }
  .barra-acao {
    position: fixed; z-index: 60; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translate(-50%, 140%);
    width: min(calc(100% - 28px), 592px); display: flex; gap: 10px; padding: 10px; border-radius: 28px;
    background: var(--glass); backdrop-filter: blur(26px) saturate(1.6); -webkit-backdrop-filter: blur(26px) saturate(1.6);
    box-shadow: var(--shadow-3), inset 0 0 0 1px var(--glass-edge); transition: transform .6s var(--ease) .08s;
  }
  .camada.aberta .barra-acao { transform: translate(-50%, 0); }
  @media (min-width: 900px) { .barra-acao { left: auto; right: 34px; transform: translateX(120%); width: 528px; } .camada.aberta .barra-acao { transform: none; } }
  .barra-acao .btn { flex: 1; white-space: nowrap; }
  .barra-acao .btn-suave { flex: 0 0 auto; padding: 0 20px; }
  .toast {
    position: fixed; z-index: 80; left: 50%; top: 18px; transform: translate(-50%, -140%);

/* ============ Boost: regra oficial (wiki oficial · 19/09) ============ */
const BOOST = [
  [0,'Novice',.50],[5,'Elemental',.40],[10,'Common',.30],[15,'Enhanced',.20],[20,'Potent',.18],
  [25,'Advanced',.15],[30,'Fortified',.12],[35,'Supreme',.10],[40,'Celestial',.08],[45,'Mystic',.05],
].map(([de, pedra, p]) => ({ de, ate: de + 5, pedra, p }));
function mediaTentativas(p) { let e = 0, chega = 1, q = p; while (chega > 1e-6) { e += chega; chega *= 1 - Math.min(1, q); q += .1; } return e; }
const piorTentativas = p => Math.ceil((1 - p) * 10 - 1e-9) + 1;
function pedrasBoost(de, ate) {
  return BOOST.map(f => { const pts = Math.max(0, Math.min(ate, f.ate) - Math.max(de, f.de)); return { ...f, pts, media: pts * mediaTentativas(f.p), pior: pts * piorTentativas(f.p) }; }).filter(f => f.pts);
}

/* ============ Star: regra oficial (wiki oficial · 19/09) ============ */
// custo da 1ª etapa na opção Diamond (D, kk); a etapa n custa n vezes isso
const STAR_ETAPA = { 'T3':[4,1], 'T2':[6,1.5], 'T1':[12,3], 'Super Rare':[16,4], 'Ultra Rare':[24,6], 'Legendary':[48,12] };
const STAR_DANO = { 'Legendary':15, 'Ultra Rare':10, 'Super Rare':8, 'T1':6, 'T2':4, 'T3':2 };
function custoStar(tier, de, ate) {
  const [d1, g1] = STAR_ETAPA[tier];
  const cheio = k => { let d = 0, g = 0; for (let n = 1; n <= k; n++) { const m = cheio(n - 1); d += n * d1 + m.d; g += n * g1 + m.g; } return { d, g }; };
  let d = 0, g = 0, copias = 0;
  for (let n = de + 1; n <= ate; n++) { const m = cheio(n - 1); d += n * d1 + m.d; g += n * g1 + m.g; copias += 2 ** (n - 1); }
  return { copias, dano: (ate - de) * STAR_DANO[tier], diamond: { d, g }, gold: { d: d / 2, g: g * 2 }, mista: { d: d * .75, g: g * 1.5 } };
}

function fusaoHeld() {

  let media = 0;

  media += .75 ** 10 * 20;
  return { media, pior: 20 };
}

  bug:'grass psychic dark', rock:'fire ice flying bug', ghost:'psychic ghost', dragon:'dragon', dark:'psychic ghost', steel:'ice rock fairy', fairy:'fighting dragon dark', normal:'' };
const FRACO = { fire:'fire water rock dragon', water:'water grass dragon', grass:'fire grass poison flying bug dragon steel', electric:'electric grass dragon ground',
  ice:'fire water ice steel', fighting:'poison flying psychic bug fairy ghost', poison:'poison ground rock ghost steel', ground:'grass bug flying', flying:'electric rock steel',
  psychic:'psychic steel dark', bug:'fire fighting poison flying ghost steel fairy', rock:'fighting ground steel', ghost:'dark normal', dragon:'steel fairy',
  dark:'fighting dark fairy', steel:'fire water electric steel', fairy:'fire poison steel', normal:'rock steel ghost' };
const mult = (a, d) => FORTE[a].split(' ').includes(d) ? 2 : FRACO[a].split(' ').includes(d) ? .5 : 1;

function matchup(n, alvo) {
  const e = DEX[n].el[0];
  const atk = alvo.el.reduce((m, d) => m * mult(e, d), 1), def = Math.max(...alvo.el.map(a => mult(a, e)));
  if (atk > 1 && def < 1) return { k:'perfeito', t:'bate forte e aguenta', c:'ideal', ord:0 };
  if (atk > 1 && def > 1) return { k:'vidro', t:'bate forte, mas apanha', c:'arriscado', ord:2 };
  if (atk > 1) return { k:'forte', t:'bate forte', c:'bate forte', ord:1 };
  if (def < 1) return { k:'tanque', t:'aguenta, bate normal', c:'aguenta', ord:3 };
  if (atk < 1) return { k:'ruim', t:'bate fraco', c:'fraco', ord:5 };
  return { k:'neutro', t:'neutro', c:'neutro', ord:4 };
}

  { tipo:'Itens', t:'Thunder Stone', s:'Stone de Electric · evolução e Boost', h:'#/i/thunder-stone' },
  { tipo:'Itens', t:'Electric Ear', s:'Drop de Raichu · receita de Boost', h:'#/i/electric-ear' },

  { tipo:'Sistemas', t:'Boost', s:'Como funciona e quantas pedras você precisa', h:'#/s/boost' },

  { tipo:'NPCs', t:'Alfred', s:'Entrada de cada ginásio de Kanto', h:'#/wiki' },
];
function buscar(q) {
  const alvo = $('#resultados'); if (!alvo) return;
  q = q.trim().toLowerCase();
  if (!q) { alvo.innerHTML = ''; return; }
  const achados = INDICE.filter(r => r.t.toLowerCase().includes(q));
  const meus = COLECAO.filter(p => nomeDe(p.n,p.s).toLowerCase().includes(q));
  if (!achados.length && !meus.length) { alvo.innerHTML = `<p class="vazio">Nada com “${esc(q)}”. Tente o nome em inglês, como aparece no jogo.</p>`; return; }
  const grupos = {};
  if (meus.length) grupos['Meus Pokémon'] = meus.map(p => ({ t:nomeDe(p.n,p.s), s:`${tierDe(p.n,p.s)}${p.boost ? ` · +${p.boost}` : ''}`, n:p.n, sh:p.s, h:`#/p/${p.n}${p.s?'s':''}`, meu:true }));
  achados.forEach(r => (grupos[r.tipo] ||= []).push(r));
  alvo.innerHTML = Object.entries(grupos).map(([g, rs]) => `<div class="grupo-res"><h3>${g}</h3><div class="lista">
    ${rs.slice(0,6).map(r => `<a class="linha" href="${r.h}">
      ${r.n ? `<span class="mini" style="--c:${cor(r.n)}"><img src="${ART(r.n, r.sh)}" alt="" loading="lazy"></span>` : `<span class="mini"></span>`}
      <span><span class="l-t" style="display:block">${esc(r.t)}</span><span class="l-s">${esc(r.s)}</span></span>
      <span class="dir">${r.meu ? 'na coleção' : r.n && temNaColecao(r.n, r.sh) ? 'você tem' : ''}${I.seta}</span></a>`).join('')}
  </div></div>`).join('');
}

function htmlPasso(pl, x, ehProx) {
  const bloq = bloqueado(pl, x), aberto = pl.aberto === x.id;
  const cls = x.estado === 'feito' ? 'feito' : bloq ? 'bloqueado' : ehProx ? 'proximo' : '';
  const est = x.estado === 'feito' ? 'feito' : x.estado === 'andando' ? 'andando' : '';
  const dir = x.estado === 'feito' ? 'feito' : bloq ? 'bloqueado'
    : x.prog ? `${x.prog.v} de ${x.prog.max}`
    : x.mats.length ? `${x.mats.filter(m => m.tem).length} de ${x.mats.length}` : '';
  return `<section class="passo-pl ${cls}">
    <button class="cab" aria-expanded="${aberto}" data-pl-abrir="${x.id}">
      <span class="estado ${est}">${est === 'feito' ? I.check : est === 'andando' ? I.relogio : I.ponto}</span>
      <span>${ehProx ? '<span class="rotulo-prox">PRÓXIMO</span>' : ''}<span class="l-t">${esc(x.t)}</span>${x.s ? `<span class="l-s">${esc(x.s)}</span>` : ''}</span>

    ${aberto ? `<div class="corpo">
      ${bloq ? `<p class="nota">${I.alerta}${esc(x.bloq)}</p>` : ''}
      ${x.aviso ? `<p class="nota">${I.alerta}${esc(x.aviso)}</p>` : ''}
      ${x.id === 'boost' ? `<a class="link-sis" href="#/s/boost">Como o Boost funciona ${I.seta}</a>` : x.id === 'star' ? `<a class="link-sis" href="#/s/star">Como a Star funciona ${I.seta}</a>` : x.id === 'held' ? `<a class="link-sis" href="#/s/helds">Como os Helds funcionam ${I.seta}</a>` : ''}
      ${x.prog ? `<div class="prog-pl">
        <button class="passo" data-pl-prog="-1" aria-label="Menos um">−</button>
        <span class="valor">+${x.prog.v}<span> de +${x.prog.max}</span></span>
        <button class="passo" data-pl-prog="1" aria-label="Mais um">+</button>
        <div class="barra"><i style="--v:${Math.max(2, x.prog.v / x.prog.max * 100)}%"></i></div>
      </div>` : ''}
      ${x.mats.length ? `<div class="mats">${x.mats.map((m, k) => `<div class="mat">
        <span>${m.i ? `<a class="t" href="#/i/${m.i}">${esc(m.t)}</a>` : `<span class="t">${esc(m.t)}</span>`}<span class="o">${esc(m.o)}</span></span>
        <button class="tenho" aria-pressed="${m.tem}" data-pl-mat="${k}">${m.tem ? I.check + 'Tenho' : 'Falta'}</button>
      </div>`).join('')}</div>` : ''}
      <div class="pe-pl">
        ${x.selo ? selo(x.selo) : '<span></span>'}
        ${x.estado === 'feito'
          ? `<button class="btn btn-suave" data-pl-desfazer="${x.id}">Desmarcar</button>`
          : bloq ? '' : `<button class="btn btn-suave" data-pl-feito="${x.id}">${I.check}Marcar feito</button>`}
      </div>
    </div>` : ''}
  </section>`;
}
function concluirPasso(pl, id) {
  const x = pl.passos.find(y => y.id === id);
  x.estado = 'feito';
  if (x.prog) x.prog.v = x.prog.max;
  x.mats.forEach(m => m.tem = true);
  let msg = `${x.curto} feito`;
  if (x.vira) {
    const antes = nomeDe(pl.n, pl.s);
    const c = COLECAO.find(p => p.n === pl.n && p.s === pl.s); if (c) c.n = x.vira;
    pl.n = x.vira;
    msg = `${antes} virou ${nomeDe(pl.n, pl.s)} na coleção`;
  } else if (x.prog) {
    const c = COLECAO.find(p => p.n === pl.n && p.s === pl.s); if (c) c.boost = x.prog.v;
    msg = `Boost +${x.prog.v} salvo na coleção`;
  } else if (id === 'star') {
    const c = COLECAO.find(p => p.n === pl.n && p.s === pl.s); if (c) c.stars = 2;
    msg = `${nomeDe(pl.n, pl.s)} agora tem 2★`;
  }
  pl.aberto = (proximoDe(pl) || {}).id;
  pintarPlano(false);
  toast(msg);
}
document.addEventListener('click', e => {
  if (!planoAtual) return;
  const t = e.target.closest('button'); if (!t) return;
  const pl = planoDe(planoAtual);
  const x = pl.passos.find(y => y.id === pl.aberto);
  if (t.dataset.plAbrir) { pl.aberto = pl.aberto === t.dataset.plAbrir ? null : t.dataset.plAbrir; pintarPlano(false); }
  else if (t.dataset.plFeito) concluirPasso(pl, t.dataset.plFeito);
  else if (t.dataset.plDesfazer) { const y = pl.passos.find(z => z.id === t.dataset.plDesfazer); y.estado = 'andando'; pintarPlano(false); }
  else if (t.dataset.plMat !== undefined && x) { const m = x.mats[+t.dataset.plMat]; m.tem = !m.tem; if (x.estado === 'afazer' && m.tem) x.estado = 'andando'; pintarPlano(false); }
  else if (t.dataset.plProg && x) { x.prog.v = Math.max(0, Math.min(x.prog.max, x.prog.v + +t.dataset.plProg)); if (x.prog.v > 0 && x.estado === 'afazer') x.estado = 'andando'; pintarPlano(false); }
  else if (t.dataset.plExtra) {
    const [id, , fazer] = EXTRAS.find(([k]) => k === t.dataset.plExtra);
    pl.passos.push({ id, curto: t.textContent.trim(), estado:'afazer', ...fazer(pl) });
    pl.aberto = id; pintarPlano(false); toast('Passo adicionado ao plano');
  }
});

        <li><span>Fale com a Rosemary, na entrada do Trade Center, e diga <b>remove</b>.</span></li>
        <li><span>Escolha o held, confira o tier e confirme. Ele volta como item, no tier atual.</span></li>
      </ol>
    </div>

    <div class="sec"><h3 class="titulo">Fontes que discordam</h3>
      ${fatoSis('A fusão pede o mesmo tipo?', 'A comunidade diz que sim. A wiki oficial diz que basta o mesmo tier, com tipos diferentes. Vale a oficial.', ['ok','Wiki oficial · 19/09'])}
      ${fatoSis('Held não dá Boost', 'A tabela que circula (T1 +5 até T7 +23) não tem fonte. Boost vem só de Boost Stone.', ['ok','Wiki oficial · 19/09'])}
    </div>

    <div class="barra-acao">
      <button class="btn btn-suave" data-reportar aria-label="Reportar erro">${I.bandeira}Erro?</button>
      <a class="btn btn-primario" href="#/plano/25s">Ver no meu plano</a>
    </div>
  </article>`, primeira);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || $('#camada').hidden) return;
  if (t.dataset.starPoke) { const i = +t.dataset.starPoke; sisS.k = i; sisS.ate = Math.min(5, COLECAO[i].stars + 2); abrirStar(false); }
  else if (t.dataset.starAte) { sisS.ate = +t.dataset.starAte; abrirStar(false); }
  else if (t.dataset.heldT) { sisH.t = +t.dataset.heldT; abrirHelds(false); }
});


/* ============ montar time ============ */
let timeAtual = null, vagaSel = null;
const timeDe = id => TIMES.find(t => t.id === id);
function resumoTime(tm) {
  const alvo = ALVOS.find(a => a.id === tm.alvo), cheios = tm.slots.filter(Boolean), out = [];
  if (!alvo) return [{ ic: I.alvo, t: 'Escolha a caçada primeiro. O time é montado contra os elementos dela.' }];
  const els = alvo.el.map(e => EL[e] || e).join(' e ');
  const fortes = cheios.filter(([n]) => matchup(n, alvo).ord <= 2).length;
  if (cheios.length) out.push({ ic: I.raio, bom: fortes >= 4, alerta: fortes < 3, t: `<b>${fortes} de ${cheios.length}</b> batem forte em ${alvo.nome} (${els}).` });
  const apanham = cheios.filter(([n]) => { const m = matchup(n, alvo); return m.k === 'vidro'; });
  if (apanham.length) out.push({ ic: I.alerta, alerta: true, t: `${apanham.map(([n, s]) => `<b>${esc(nomeDe(n, s))}</b>`).join(', ')} ${apanham.length > 1 ? 'apanham' : 'apanha'} forte de ${alvo.nome}. Leve cura ou um held de defesa.` });
  const fracos = cheios.filter(([n]) => matchup(n, alvo).k === 'ruim');
  if (fracos.length) out.push({ ic: I.alerta, alerta: true, t: `${fracos.map(([n, s]) => `<b>${esc(nomeDe(n, s))}</b>`).join(', ')} ${fracos.length > 1 ? 'batem' : 'bate'} fraco aqui. Troque se tiver opção.` });
  if (alvo.sug) {
    const tem = alvo.sug.filter(([n, s]) => cheios.some(([a, b]) => a === n && b === s));
    const falta = alvo.sug.filter(x => !tem.includes(x));
    const evolui = falta.filter(([n, s]) => n === 26 && cheios.some(([a, b]) => a === 25 && b === s));
    out.push({ ic: I.alvo, t: `Do time que a comunidade usa contra ${alvo.nome}, você tem <b>${tem.length} de 6</b>${falta.length ? `. Faltam ${falta.map(([n, s]) => esc(nomeDe(n, s))).join(', ')}` : ''}${evolui.length ? ' (o Shiny Pikachu vira Shiny Raichu no seu plano)' : ''}.` });
  } else out.push({ ic: I.alvo, t: `A comunidade usa contra ${alvo.nome}: ${alvo.sugNomes}.` });
  const off = cheios.filter(([n]) => OFFTANK.has(n)).length;
  if (cheios.length >= 4) out.push({ ic: I.caixa, alerta: off === 0, t: off ? `<b>${off} offtank${off > 1 ? 's' : ''}</b> para abrir a rotação e ${cheios.length - off} de dano. Em Hoenn, a comunidade usa 2 e 4.` : 'Ninguém para segurar dano. Em Hoenn, a comunidade abre a rotação com 2 offtanks.' });
  if (cheios.length < 6) out.push({ ic: I.mais, t: `${6 - cheios.length} vaga${6 - cheios.length > 1 ? 's' : ''} livre${6 - cheios.length > 1 ? 's' : ''}. A rotação precisa dos seis para sempre ter alguém pronto.` });
  return out;
}
function abrirTime(id) {
  cad = null; fichaAtual = null; planoAtual = null; itemAtual = null;
  if (id === 'novo') { const nid = 't' + Date.now().toString(36); TIMES.push({ id: nid, nome: `Time ${TIMES.length + 1}`, alvo: null, slots: [null, null, null, null, null, null], novo: true }); history.replaceState(null, '', '#/time/' + nid); id = nid; }
  if (!timeDe(id)) return;
  if (timeAtual !== id) vagaSel = null;
  timeAtual = id;
  pintarTime($('#camada').hidden);
}
function pintarTime(primeira) {
  const tm = timeDe(timeAtual), alvo = ALVOS.find(a => a.id === tm.alvo);
  const cheios = tm.slots.filter(Boolean);
  const ranking = alvo ? COLECAO.map(c => ({ c, m: matchup(c.n, alvo) })).sort((a, b) => a.m.ord - b.m.ord || (b.c.s - a.c.s)) : COLECAO.map(c => ({ c, m: null }));
  const noTime = c => tm.slots.some(x => x && x[0] === c.n && x[1] === c.s);
  const html = `<article class="folha" role="dialog" aria-modal="true" aria-label="${esc(tm.nome)}" style="--c:${alvo ? `var(--el-${alvo.el[0]})` : 'var(--m-500)'}">
    <div class="folha-palco time-palco">
      ${alvo ? `<div class="fundo" style="background-image:url('${ART(alvo.n)}')"></div>` : ''}
      <span class="puxador"></span>
      <div class="folha-topo"><button class="redondo" data-fechar aria-label="Voltar">${I.voltar}</button></div>
      ${alvo ? `<div class="alvo-arte"><img src="${ART(alvo.n)}" alt="${alvo.nome}"></div>` : ''}
    </div>
    <div class="etiqueta">
      <h2 class="display">${esc(tm.nome)}</h2>
      <p class="plano-meta">${alvo ? `Contra ${alvo.nome}: ${alvo.el.map(e => EL[e] || e).join(' e ')} · ${alvo.lvl}` : 'Primeiro a caçada, depois o time.'}</p>
    </div>

    <div class="sec"><h3 class="titulo">Para qual caçada</h3>
      <div class="alvos" role="group" aria-label="Caçada">${ALVOS.map(a => `<button aria-pressed="${a.id === tm.alvo}" data-t-alvo="${a.id}"><img src="${ART(a.n)}" alt=""><b>${a.nome}</b><span>${a.el.map(e => EL[e] || e).join(' / ')}</span></button>`).join('')}</div>
    </div>

    <div class="sec"><h3 class="titulo">Os seis</h3>
      <div class="vagas">${tm.slots.map((x, i) => { if (!x) return `<button class="vaga vazia" aria-pressed="${vagaSel === i}" data-t-vaga="${i}">${I.mais}Vaga ${i + 1}</button>`;
        const m = alvo ? matchup(x[0], alvo) : null;
        return `<button class="vaga" aria-pressed="${vagaSel === i}" data-t-vaga="${i}" style="--c:${cor(x[0])}" aria-label="${esc(nomeDe(x[0], x[1]))}${m ? ', ' + m.t : ''}">${arte(x[0], x[1])}${m ? `<span class="selo-m m-${m.k}">${m.c}</span>` : ''}</button>`; }).join('')}</div>
      ${alvo && !cheios.length ? `<button class="btn btn-primario" data-t-sugerir style="width:100%;margin-top:12px">${I.raio}Montar com os melhores da minha coleção</button>` : ''}
      ${vagaSel !== null ? `<div class="escolher">
        <div class="cab-e"><b>Vaga ${vagaSel + 1}</b><span>${tm.slots[vagaSel] ? `<button data-t-tirar>Tirar</button> · ` : ''}<button data-t-fechar-vaga>Fechar</button></span></div>
        <div class="lista" style="border-radius:0;box-shadow:none">${[...ranking].sort((a, b) => noTime(a.c) - noTime(b.c)).map(({ c, m }) => `<button class="linha ${noTime(c) ? 'no-time' : ''}" data-t-pick="${c.n}${c.s ? 's' : ''}" ${noTime(c) ? 'disabled' : ''}>
          <span class="mini" style="--c:${cor(c.n)}"><img src="${ART(c.n, c.s)}" alt="" loading="lazy"></span>
          <span><span class="l-t" style="display:block">${esc(nomeDe(c.n, c.s))}</span><span class="l-s">${tierDe(c.n, c.s)} · ${EL[DEX[c.n].el[0]]}${noTime(c) ? ' · já no time' : ''}</span></span>
          ${m ? `<span class="dir"><span class="tag-m m-${m.k}">${m.t}</span></span>` : ''}</button>`).join('')}</div>
      </div>` : ''}
    </div>

    <div class="sec"><h3 class="titulo">O que o app vê</h3>
      <div class="analise-t">${resumoTime(tm).map(r => `<div class="a ${r.alerta ? 'alerta' : r.bom ? 'bom' : ''}">${r.ic}<span>${r.t}</span></div>`).join('')}</div>
      <p class="aviso">Conta com um elemento por Pokémon e só forte (2×) ou fraco (½), como faz a ferramenta da comunidade. Times de referência: 22 times enviados ao Critical Catch até 17/09.</p>
    </div>

    <div class="barra-acao">
      <button class="btn btn-suave" data-t-compartilhar>Compartilhar</button>
      <button class="btn btn-primario" data-t-salvar>Salvar time</button>
    </div>
  </article>`;
  mostrarSistema(html, primeira);
}
document.addEventListener('click', e => {
  if (!timeAtual || $('#camada').hidden || !$('#camada .time-palco')) return;
  const t = e.target.closest('button'); if (!t) return;
  const tm = timeDe(timeAtual);
  if (t.dataset.tAlvo) { tm.alvo = t.dataset.tAlvo; pintarTime(false); }
  else if (t.dataset.tVaga) { const i = +t.dataset.tVaga; vagaSel = vagaSel === i ? null : i; pintarTime(false); }
  else if (t.matches('[data-t-fechar-vaga]')) { vagaSel = null; pintarTime(false); }
  else if (t.matches('[data-t-tirar]')) { tm.slots[vagaSel] = null; vagaSel = null; pintarTime(false); }
  else if (t.dataset.tPick) { const k = t.dataset.tPick; tm.slots[vagaSel] = [parseInt(k), k.endsWith('s')]; const prox = tm.slots.findIndex(x => !x); vagaSel = prox >= 0 ? prox : null; pintarTime(false); }
  else if (t.matches('[data-t-sugerir]')) {
    const alvo = ALVOS.find(a => a.id === tm.alvo);
    const vistos = new Set();
    const melhores = COLECAO.map(c => ({ c, m: matchup(c.n, alvo) })).filter(x => x.m.ord <= 3).sort((a, b) => a.m.ord - b.m.ord || (b.c.s - a.c.s))
      .filter(({ c }) => { const k = c.n + (c.s ? 's' : ''); if (vistos.has(k)) return false; vistos.add(k); return true; }).slice(0, 6);
    tm.slots = [...melhores.map(({ c }) => [c.n, c.s]), ...Array(6).fill(null)].slice(0, 6);
    vagaSel = null; pintarTime(false); toast(`${melhores.length} Pokémon da sua coleção entraram`);
  }
  else if (t.matches('[data-t-compartilhar]')) { try { navigator.clipboard.writeText(location.href); } catch (err) {} toast('Link do time copiado. Cole no Discord'); }
  else if (t.matches('[data-t-salvar]')) { delete tm.novo; fecharFicha(false); timeAtual = null; location.hash = '#/meus/times'; toast(`${tm.nome} salvo`); }
});

/* ============ roteador ============ */
let baseAtual = null;
function rotear() {
  const h = location.hash.replace(/^#/, '') || '/entrada';
  const en = h.match(/^\/entrada(?:\/(personagem|pronto))?$/);
  if (en) {
    fecharFicha(false);
    if (!baseAtual) desenhar('/inicio');
    abrirEntrada(en[1] || 'boas');
    return;
  }
  fecharEntrada(); ent = null;
  const novo = h.match(/^\/novo(?:\/(\d+)(s?))?$/);
  if (novo) {
    if (!baseAtual) desenhar('/meus/colecao');
    abrirCadastro(novo[1] ? { n:+novo[1], s:!!novo[2] } : null);
    return;
  }
  const tmm = h.match(/^\/time\/([a-z0-9]+)$/);
  if (tmm) {
    if (!baseAtual) desenhar('/meus/times');
    abrirTime(tmm[1]);
    return;
  }
  if (h === '/s/star' || h === '/s/helds') {
    if (!baseAtual) desenhar('/wiki');
    h === '/s/star' ? abrirStar() : abrirHelds();
    return;
  }
  if (h === '/s/boost') {
    if (!baseAtual) desenhar('/wiki');
    abrirSistema();
    return;
  }
  const it = h.match(/^\/i\/([a-z-]+)$/);
  if (it) {
    if (!baseAtual) desenhar('/wiki');
    abrirItem(it[1]);
    return;
  }
  const pl = h.match(/^\/plano\/(\d+s?)$/);
  if (pl) {
    if (!baseAtual) desenhar('/meus/planos');
    abrirPlano(pl[1]);
    return;
  }
  const p = h.match(/^\/p\/(\d+)(s?)$/);
  if (p) {
    if (!baseAtual) desenhar('/inicio');
    abrirFicha(+p[1], !!p[2]);
    return;
  }
  fecharFicha(false);
  desenhar(h);
}
function desenhar(h) {
  const [, porta = 'inicio', sub] = h.split('/');
  const fn = TELAS[porta] || TELAS.inicio;
  baseAtual = h;
  const tela = $('#tela');
  tela.innerHTML = fn(sub);
  document.querySelectorAll('.porta').forEach(a => { if (a.dataset.porta === porta) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0, 0);
  if (porta === 'buscar') { const q = $('#q'); buscar(q.value); q.addEventListener('input', e => buscar(e.target.value)); }
}

/* ============ eventos ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.matches('a[href="#/wiki"]:not(.porta):not(.btn)')) { e.preventDefault(); toast('Esta página ainda não foi desenhada', I.relogio); return; }
  if (t.matches('[data-fechar]')) { fecharFicha(); return; }
  if (t.matches('[data-aba]')) { location.hash = '#/meus/' + t.dataset.aba; return; }
  if (t.matches('[data-forma]') && fichaAtual) { const s = t.dataset.forma === 'shiny'; history.replaceState(null, '', `#/p/${fichaAtual.n}${s ? 's' : ''}`); abrirFicha(fichaAtual.n, s); document.querySelector('#camada').classList.add('aberta'); return; }
  if (t.matches('[data-adicionar]')) { location.hash = `#/novo/${fichaAtual.n}${fichaAtual.s ? 's' : ''}`; return; }
  if (t.matches('[data-planejar]')) { location.hash = `#/plano/${fichaAtual.n}${fichaAtual.s ? 's' : ''}`; return; }
  if (t.matches('[data-reportar]')) { toast('Obrigado — o erro vai para a revisão da base'); return; }
  if (t.matches('[data-q]')) { const q = $('#q'); q.value = t.dataset.q; buscar(q.value); q.focus(); return; }
  if (t.matches('[data-escolher-tema]')) {
    const v = t.dataset.escolherTema;
    try { v === 'sistema' ? localStorage.removeItem('pka-tema') : localStorage.setItem('pka-tema', v); } catch (err) {}
    window.__setTema(v === 'sistema' ? null : v);
    desenhar(baseAtual); return;
  }
  if (t.id === 'exportar') { toast('Arquivo gerado — em produção, baixa o JSON'); return; }
  if (t.id === 'apagar') { toast('No protótipo nada é apagado'); return; }
  if (t.id === 'add-char') { location.hash = '#/entrada/personagem'; return; }
});
$('#camada').addEventListener('click', e => { if (e.target.id === 'camada') fecharFicha(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharFicha(); });
window.addEventListener('hashchange', rotear);
rotear();
</script>
